name: Test

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  elisp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Emacs
        uses: jcs090218/setup-emacs@master
        with:
          version: '30.2'

      - name: Install ELPA dependencies
        run: |
          chmod +x scripts/install-elpa-deps
          ./scripts/install-elpa-deps

      - name: Run lint checks
        run: |
          export HOME=$GITHUB_WORKSPACE
          chmod +x scripts/parse scripts/checkdoc scripts/load-check scripts/byte-compile
          ./scripts/parse eve.el test/eve-test.el
          ./scripts/checkdoc eve.el test/eve-test.el
          ./scripts/load-check
          ./scripts/byte-compile

      - name: Run ERT tests
        run: |
          export HOME=$GITHUB_WORKSPACE
          chmod +x scripts/ert
          ./scripts/ert

  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Emacs
        uses: jcs090218/setup-emacs@master
        with:
          version: '30.2'

      - name: Install ELPA dependencies
        run: |
          chmod +x scripts/install-elpa-deps
          ./scripts/install-elpa-deps

      - name: Check documentation coverage
        run: |
          export HOME=$GITHUB_WORKSPACE
          chmod +x scripts/gen-docs scripts/check-doc-drift
          ./scripts/gen-docs
          ./scripts/check-doc-drift

  python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Nix
        uses: cachix/install-nix-action@v31

      - name: Use the public devenv cache
        uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Run CLI health suite with declared media dependencies
        # Python, uv, FFmpeg, fontconfig and the test font come from devenv.nix.
        # Pin the bootstrap CLI; project inputs remain pinned in devenv.lock.
        run: nix run --accept-flake-config github:cachix/devenv/v2.4.0 -- -q shell -- ./scripts/check.sh
